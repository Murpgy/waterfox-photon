# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Theme check

# Lightweight CI for the photon-classic overlay. No signing, no release
# pipeline: lint plus manifest coherence run on every push/PR, the headed
# mochitests run only on manual dispatch (they need a full dev build).
# Optimized per-platform builds live in their own workflows
# (build-linux.yml, build-windows.yml) so each dispatches alone.
on:
  push:
    paths:
      - "waterfox/browser/themes/**"
      - "waterfox/browser/components/theme/**"
      - "waterfox/browser/components/settings/waterfoxAppearance*"
      - "waterfox/browser/components/onboarding/**"
      - "python/sites/lint.txt"
      - "scripts/ci/theme-coherence.py"
      - ".github/workflows/theme-check.yml"
  pull_request:
    paths:
      - "waterfox/browser/themes/**"
      - "waterfox/browser/components/theme/**"
      - "waterfox/browser/components/settings/waterfoxAppearance*"
      - "waterfox/browser/components/onboarding/**"
      - "python/sites/lint.txt"
      - ".github/workflows/theme-check.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MOZ_NOSPAM: "1"

jobs:
  lint:
    name: Lint theme files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ESLint touched theme JS
        shell: bash
        run: |
          ./mach eslint \
            waterfox/browser/components/theme/WaterfoxBrowserStyle.sys.mjs \
            waterfox/browser/components/theme/WaterfoxTheme.sys.mjs \
            waterfox/browser/components/theme/test/browser/browser_waterfox_photon_classic.js \
            waterfox/browser/components/theme/test/browser/browser_waterfox_style_migration.js \
            waterfox/browser/components/settings/waterfoxAppearance.mjs \
            waterfox/browser/components/settings/waterfoxAppearanceOptions.mjs \
            waterfox/browser/components/onboarding/WaterfoxOnboardingActions.sys.mjs

      - name: Stylelint photon-classic CSS
        shell: bash
        run: ./mach lint --linter stylelint waterfox/browser/themes/photon-classic/

      - name: Manifest and wiring sanity
        shell: bash
        run: python3 scripts/ci/theme-coherence.py

  theme-tests:
    name: Theme mochitests (Linux dev build)
    # Manual dispatch only: needs a full build, far too heavy per-push.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Bootstrap build dependencies
        shell: bash
        run: python3 mach bootstrap --application-choice=browser

      - name: Fetch pinned clang
        shell: bash
        run: scripts/fetch-clang-22.sh

      - name: Dev build (tracked .mozconfig, no LTO/PGO)
        shell: bash
        run: ./mach build

      - name: photon-classic tests
        shell: bash
        run: |
          ./mach test --headless \
            waterfox/browser/components/theme/test/browser/browser_waterfox_photon_classic.js

      - name: Theme regression tests
        shell: bash
        run: |
          ./mach test --headless \
            waterfox/browser/components/theme/test/browser/browser_waterfox_style_migration.js \
            waterfox/browser/components/onboarding/test/browser/browser_waterfox_onboarding_actions.js
