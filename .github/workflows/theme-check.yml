# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Theme check

# Lightweight CI for the photon-classic overlay. No signing, no release
# pipeline: lint plus manifest coherence run on every push/PR, the headed
# mochitests run only on manual dispatch (they need a full dev build).
on:
  push:
    paths:
      - "waterfox/browser/themes/**"
      - "waterfox/browser/components/theme/**"
      - "waterfox/browser/components/settings/waterfoxAppearance*"
      - "waterfox/browser/components/onboarding/**"
      - "python/sites/lint.txt"
      - "scripts/ci/theme-coherence.py"
      - ".github/workflows/theme-check.yml"
  pull_request:
    paths:
      - "waterfox/browser/themes/**"
      - "waterfox/browser/components/theme/**"
      - "waterfox/browser/components/settings/waterfoxAppearance*"
      - "waterfox/browser/components/onboarding/**"
      - "python/sites/lint.txt"
      - ".github/workflows/theme-check.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MOZ_NOSPAM: "1"

jobs:
  lint:
    name: Lint theme files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ESLint touched theme JS
        shell: bash
        run: |
          ./mach eslint \
            waterfox/browser/components/theme/WaterfoxBrowserStyle.sys.mjs \
            waterfox/browser/components/theme/test/browser/browser_waterfox_photon_classic.js \
            waterfox/browser/components/settings/waterfoxAppearance.mjs \
            waterfox/browser/components/settings/waterfoxAppearanceOptions.mjs \
            waterfox/browser/components/onboarding/WaterfoxOnboardingActions.sys.mjs

      - name: Stylelint photon-classic CSS
        shell: bash
        run: ./mach lint --linter stylelint waterfox/browser/themes/photon-classic/

      - name: Manifest and wiring sanity
        shell: bash
        run: python3 scripts/ci/theme-coherence.py

  theme-tests:
    name: Theme mochitests (Linux dev build)
    # Manual dispatch only: needs a full build, far too heavy per-push.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap build dependencies
        shell: bash
        run: python3 mach bootstrap --application-choice=browser

      - name: Fetch pinned clang
        shell: bash
        run: scripts/fetch-clang-22.sh

      - name: Dev build (tracked .mozconfig, no LTO/PGO)
        shell: bash
        run: ./mach build

      - name: photon-classic tests
        shell: bash
        run: |
          ./mach test --headless \
            waterfox/browser/components/theme/test/browser/browser_waterfox_photon_classic.js

      - name: Theme regression tests
        shell: bash
        run: |
          ./mach test --headless \
            waterfox/browser/components/theme/test/browser/browser_waterfox_style_migration.js \
            waterfox/browser/components/onboarding/test/browser/browser_waterfox_onboarding_actions.js

  optimized-build:
    name: Optimized build (${{ matrix.name }})
    # Manual dispatch only: multi-hour builds on hosted runners. No signing,
    # no release channel, no tests in the binary; the artifacts are unsigned
    # dogfood builds for validating the theme at full optimization.
    # Platforms build in parallel (no needs: between them), so wall-clock is
    # the slower platform, not the sum. Plain --enable-lto (thin, C++ only)
    # on both: upstream's own validated setting per platform. Cross-language
    # LTO is deliberately avoided -- it needs the exact upstream trio
    # (wfx_lto_mode=cross + wfx_rustc_bootstrap=1 + nightly -Z rustflags)
    # and fails the libxul link with ld.lld "Invalid record" otherwise.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            artifact: waterfox-opt-build-linux-x64
            apt_packages: xvfb zstd
            rust_target: ""
            build_command: xvfb-run -a --server-args="-screen 0 1280x1024x24" ./mach build
          - name: Windows x64
            artifact: waterfox-opt-build-windows-x64
            apt_packages: msitools zstd
            rust_target: x86_64-pc-windows-msvc
            build_command: ./mach build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Optimized mozconfig
        shell: bash
        run: |
          if [[ "${{ matrix.name }}" == "Windows x64" ]]; then
            cat > .mozconfig <<'EOF'
          wfx_target=x86_64-pc-windows-msvc
          wfx_cross_build=1
          . "$topsrcdir/waterfox/build/mozconfig.common"
          ac_add_options --disable-tests
          ac_add_options --enable-lto
          ac_add_options --enable-optimize="-clang:-march=x86-64-v2 -clang:-mtune=haswell -clang:-O3 -w"
          EOF
          else
            cat > .mozconfig <<'EOF'
          wfx_dev=1
          . "$topsrcdir/waterfox/build/mozconfig.common"
          ac_add_options --disable-tests
          ac_add_options --enable-lto
          ac_add_options --enable-optimize="-march=x86-64-v2 -mtune=haswell -O3 -w"
          EOF
          fi

      - name: Install build packages
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y ${{ matrix.apt_packages }}

      - name: Bootstrap build dependencies
        shell: bash
        run: python3 mach bootstrap --application-choice=browser

      - name: Fetch pinned clang
        shell: bash
        run: scripts/fetch-clang-22.sh

      - name: Add Windows Rust target
        if: ${{ matrix.rust_target != '' }}
        shell: bash
        run: rustup target add --toolchain "1.98.1" "${{ matrix.rust_target }}"

      - name: Optimized build
        shell: bash
        run: ${{ matrix.build_command }}

      - name: Package
        shell: bash
        run: ./mach package

      - name: Bundle unsigned build
        shell: bash
        run: |
          objdir="$(ls -d obj-* | head -n 1)"
          tar -C "$objdir/dist" -cf waterfox-opt-build.tar waterfox

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: waterfox-opt-build.tar
