# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Windows

# Standalone optimized Windows x64 dogfood build, cross-compiled with
# clang-cl on ubuntu-latest (same approach as upstream's release stage 1/3,
# minus PGO). No signing, no release channel, no tests in the binary.
# Dispatches alone via workflow_dispatch so Windows retries never burn
# Linux minutes.
#
# Memory hardening (learned the hard way): the Windows cross link runs
# clang-cl + Wine + rustc + lld-link concurrently and the hosted runner was
# SIGTERM-killed (exit 143) at -j4 with no swap. This job caps make at -j2
# and provisions 8G of swap; slower per-minute, survives the link.
# LTO is deliberately off on this leg: clang-22 emits bitcode attributes
# that the bundled rustc-1.98 LLVM 21 reader rejects ("Unknown attribute
# kind (105)") once -flto=thin/-Cembed-bitcode enter the mixed C/Rust link.
# -O3 carries the optimization; the theme code under test is
# optimization-independent.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOZ_NOSPAM: "1"
  RUST_TOOLCHAIN: "1.98.1"
  # Fully serial compilation: the 16GB runner OOMs with any concurrency on
  # the Windows cross link (2x clang-cl + 2x rustc exceeded 14Gi RAM + 5Gi
  # swap before the SIGTERM). Slow (~2-3h) but survives; sccache fills the
  # cache meanwhile so later runs get faster AND leaner.
  CARGO_BUILD_JOBS: "1"
  # sccache with the GitHub Actions cache backend (see build-linux.yml).
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: Optimized build (Windows x64, -O3)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Optimized mozconfig (Windows cross, -O3, no LTO, -j1)
        shell: bash
        run: |
          cat > .mozconfig <<'EOF'
          wfx_target=x86_64-pc-windows-msvc
          wfx_cross_build=1
          . "$topsrcdir/waterfox/build/mozconfig.common"
          ac_add_options --disable-tests
          ac_add_options --enable-optimize="-clang:-march=x86-64-v2 -clang:-mtune=haswell -clang:-O3 -w"
          EOF
          echo 'mk_add_options MOZ_MAKE_FLAGS="-j1"' >> .mozconfig
          # Release builds pin -C codegen-units=1 (config/makefiles/rust.mk),
          # which balloons the single gkrust codegen unit past 30Gi RSS on
          # this target. Shard to 16 via env override (see rust.mk hunk).
          echo 'mk_add_options "export RUSTFLAGS_CODEGEN_UNITS_OVERRIDE=16"' >> .mozconfig

      - name: Free disk space (remove hosted toolchains we re-fetch pinned)
        shell: bash
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h / | tail -n 1

      - name: Provision emergency swap (24G; 64G overfilled the runner disk)
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          (sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576 status=none)
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h / /tmp | head -n 5

      - name: Install build packages
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y msitools zstd

      - name: Bootstrap build dependencies
        shell: bash
        run: python3 mach bootstrap --application-choice=browser

      - name: Fetch pinned clang
        shell: bash
        run: scripts/fetch-clang-22.sh

      - name: Pin Rust toolchain and add Windows target
        shell: bash
        run: |
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add --toolchain "${RUST_TOOLCHAIN}" x86_64-pc-windows-msvc

      - name: Optimized build
        shell: bash
        run: |
          (while true; do echo "--- mem $(date -u +%H:%M:%S) ---"; free -h; sleep 180; done) &
          echo "$!" > /tmp/memwatch.pid
          ./mach build
          kill "$(cat /tmp/memwatch.pid)" || true

      - name: Package
        shell: bash
        run: ./mach package

      - name: Bundle unsigned build
        shell: bash
        run: |
          objdir="$(ls -d obj-* | head -n 1)"
          tar -C "$objdir/dist" -cf waterfox-opt-build.tar waterfox

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: waterfox-opt-build-windows-x64
          path: waterfox-opt-build.tar
